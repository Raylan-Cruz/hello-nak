<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            background-image: url("bgimage.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            font-size: 80px;
            text-shadow: 3px 3px 8px black;
        }

      .left-gif,
.right-gif {
    position: absolute;
    bottom: 20px;
    width: min(180px, 28vw);
    
}

.left-gif {
    left: 20px;
    transform: scaleX(-1);
}

.right-gif {
    right: 20px;
}

        @media (max-width: 600px) {
    h1 {
        font-size: 50px;
    }

    .left-gif,
    .right-gif {
        width: 130px;
        bottom: 10px;
    }
            .left-gif {
    
    transform: scaleX(-1);
}

}
    </style>
</head>
<body>

    <h1>hii nak Lheslin</h1>

    <img src="catdancee.gif" class="left-gif" alt="Left GIF">
    <img src="catdancee.gif" class="right-gif" alt="Right GIF">

</body>
</html>
